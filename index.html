      // Dil: ?lang=tr|en|ar, yoksa tarayıcı dili, yoksa İngilizce.
      function initialLang() {
        var m = /[?&]lang=(tr|en|ar)\b/.exec(location.search);
        if (m) return m[1];
        var nav = (navigator.language || '').toLowerCase();
        if (nav.indexOf('tr') === 0) return 'tr';
        if (nav.indexOf('ar') === 0) return 'ar';
        return 'en';
      }

      var state = { doc: 'privacy', lang: initialLang() };

        var c = LEGAL[state.doc][state.lang];

        document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
        document.getElementById('brand-sub').textContent = labels.sub;
        document.getElementById('tab-privacy').textContent = labels.privacy;
        document.getElementById('tab-terms').textContent = labels.terms;
        document.getElementById('doc-heading').textContent = c.heading;
        document.getElementById('doc-updated').textContent = c.updated;

        var html = '';
        for (var i = 0; i < c.sections.length; i++) {
          var s = c.sections[i];
          // Hesap silme bölümü Google Play'in "hesap silme URL'si" için #delete-account ile açılır.
          var id = /Silme|Deletion|حذف/.test(s.title) ? ' id="delete-account"' : '';
          html +=
            '<div class="section"' + id + '><h3>' +
            escapeHtml(s.title) +
            '</h3><p>' +
            escapeHtml(s.body) +

        document.getElementById('lang-en').className = state.lang === 'en' ? 'active' : '';
        document.getElementById('lang-ar').className = state.lang === 'ar' ? 'active' : '';
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');

      function setDoc(d) {
